services:
  api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=${PORT:-3000}
      - DATA_DIR=/data
      - TRUST_PROXY=${TRUST_PROXY:-1}
    volumes:
      - opengym-data:/data
      - opengym-coach-auth:/coach-auth
  web:
    image: ghcr.io/duartesantos8/opengym-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      - NGINX_PORT=80
      - BACKEND=api
      - PORT=${PORT:-3000}
      - RESOLVER=127.0.0.11
      - MEDIA_UPLOAD_MAX=48m
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      start_period: 10s
      start_interval: 2s
      retries: 3
    networks:
      - dokploy-network
      - default
volumes:
  opengym-data:
  opengym-coach-auth:
networks:
  dokploy-network:
    external: true
